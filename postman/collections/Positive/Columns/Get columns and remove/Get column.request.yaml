$kind: http-request
url: "{{BaseURL}}/{{columns}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Set columnsID\", function () {\r

      \    let responseText = pm.response.text();\r

      \r

      \    let jsonData = JSON.parse(responseText);\r

      \    let column = jsonData[0]; \r

      \r

      \    pm.environment.set(\"columnsID\", column.id);\r

      });"
    language: text/javascript
order: 1782727881273
