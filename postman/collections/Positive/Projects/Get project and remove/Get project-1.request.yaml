$kind: http-request
name: Get project
url: "{{BaseURL}}/{{project}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Set projectID\", function () {\r

      \    let responseText = pm.response.text();\r

      \r

      \    let jsonData = JSON.parse(responseText);\r

      \    let project = jsonData[0]; \r

      \r

      \    pm.environment.set(\"projectID\", project.id);\r

      });"
    language: text/javascript
order: 431654100397955
